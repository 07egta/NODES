name: 機能の提案 / Feature request
description: 新しい機能や改善の提案 / Propose a new feature or improvement
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        小さな改善も歓迎です。まずは困っていることから書いてください。
        Small improvements are welcome. Start with the problem you are facing.
  - type: textarea
    id: problem
    attributes:
      label: 困っていること / Problem
      description: 今どうしているか、何が不便か / What you do today and what is inconvenient
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案 / Proposal
      description: 実現してほしい動作 / The behaviour you would like
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 代替案 / Alternatives
  - type: dropdown
    id: area
    attributes:
      label: 関係する領域 / Area
      multiple: true
      options:
        - ノード / Node
        - UI / UI
        - G-code / G-code
        - STL / STL
        - ドキュメント / Docs
        - その他 / Other
  - type: checkboxes
    id: checks
    attributes:
      label: 確認 / Checks
      options:
        - label: 同じ内容の既存Issueがないことを確認した / I searched existing issues for duplicates
          required: true
        - label: 提案は Rust で実装できる範囲である（他言語・他製品の部品に依存しない） / The idea can be built in Rust without depending on other-language runtimes or other products
          required: true
