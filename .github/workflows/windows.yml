name: Check

on:
  pull_request:
  push:
    branches: [main, "evolve/**", "develop/**", "unify/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: 1.100.0
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUST_BACKTRACE: 1

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust and quality tools
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - name: Install desktop build libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev \
            libx11-dev libxi-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libgl1-mesa-dev
      - name: Restore Rust cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-${{ env.RUST_TOOLCHAIN }}-quality-v1-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
      - name: Record compiler
        run: |
          rustc --version --verbose
          cargo --version
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test inventory and checkpoint scripts
        run: |
          python3 scripts/update_gh2_inventory.py --self-test
          python3 scripts/export_ci_checkpoint.py --self-test
          python3 scripts/audit_dependencies.py --self-test
          python3 scripts/generate_sum_oracle.py --check
          python3 scripts/generate_interpolation_oracle.py --check
      - name: Audit exact dependency declarations
        run: |
          cargo metadata --locked --format-version 1 > "$RUNNER_TEMP/nodes-cargo-metadata.json"
          python3 scripts/audit_dependencies.py --metadata "$RUNNER_TEMP/nodes-cargo-metadata.json" --output "$RUNNER_TEMP/dependency-manifests.json"
      - name: Check all targets
        run: cargo check --all-targets --locked
      - name: Check Clippy warnings
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test all targets
        run: cargo test --all-targets --locked
      - name: Print evaluator timings (informational, dev profile)
        run: cargo test --locked --test engine_perf_tests -- --nocapture --test-threads=1
      - name: Build Linux desktop and console applications
        run: cargo build --release --locked --bins
      - name: Verify portable Japanese project on Linux
        run: python3 scripts/native_smoke.py --cli target/release/nodes-cli --fixture examples/01.morph --output-dir "$RUNNER_TEMP/native-cli-linux"
      - name: Upload Linux fixture evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-cli-linux-${{ github.sha }}
          path: ${{ runner.temp }}/native-cli-linux
          if-no-files-found: warn
          retention-days: 14
      - name: Prepare Linux development artifact
        run: |
          package="$RUNNER_TEMP/NODES-linux-x64"
          mkdir -p "$package"
          cp target/release/NODES target/release/nodes-cli README.md LICENSE-MIT LICENSE-APACHE Cargo.lock "$package/"
          cp -R examples licenses docs "$package/"
          cp "$RUNNER_TEMP/dependency-manifests.json" "$package/docs/development/dependency-manifests.json"
          printf 'NODES development build\nCommit: %s\nTarget: x86_64-unknown-linux-gnu\nGUI and physical 3D printing validation are separate from CI.\n' "$GITHUB_SHA" > "$package/BUILD-INFO.txt"
          tar -czf "$RUNNER_TEMP/NODES-linux-x64.tar.gz" -C "$package" .
      - name: Upload Linux development artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NODES-linux-x64-${{ github.sha }}
          path: ${{ runner.temp }}/NODES-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14

  windows:
    needs: linux
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Restore Rust cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ runner.arch }}-rust-${{ env.RUST_TOOLCHAIN }}-release-v1-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
      - name: Record compiler
        run: |
          rustc --version --verbose
          cargo --version
      - name: Test all targets
        run: cargo test --all-targets --locked
      - name: Build Windows desktop and console applications
        run: cargo build --release --locked --bins
      - name: Verify portable Japanese project on Windows
        shell: pwsh
        run: python scripts/native_smoke.py --cli target/release/nodes-cli.exe --fixture examples/01.morph --output-dir "$env:RUNNER_TEMP/native-cli-windows"
      - name: Upload Windows fixture evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-cli-windows-${{ github.sha }}
          path: ${{ runner.temp }}/native-cli-windows
          if-no-files-found: warn
          retention-days: 14
      - name: Prepare development artifact
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP "NODES-windows-x64"
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          Copy-Item target/release/NODES.exe,target/release/nodes-cli.exe $package
          Copy-Item README.md,LICENSE-MIT,LICENSE-APACHE,Cargo.lock $package
          Copy-Item examples,licenses,docs $package -Recurse
          @(
            "NODES development build"
            "Commit: $env:GITHUB_SHA"
            "Target: x86_64-pc-windows-msvc"
            "Compiler: $(rustc --version)"
            "Build: cargo build --release --locked --bins"
            "Tests: cargo test --all-targets --locked (Windows and Linux)"
            "This CI artifact has not been validated by GUI or 3D-print hardware testing."
            "License audit scope and unresolved items: docs/DEPENDENCIES.md"
          ) | Set-Content (Join-Path $package "BUILD-INFO.txt") -Encoding utf8
      - name: Upload Windows development artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NODES-windows-x64-${{ github.sha }}
          path: ${{ runner.temp }}/NODES-windows-x64
          if-no-files-found: error
          retention-days: 14
      - name: Package Windows zip
        shell: pwsh
        run: |
          $d = "NODES-windows"
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item target/release/NODES.exe $d/
          Copy-Item examples $d/examples -Recurse
          New-Item -ItemType Directory -Force $d/docs | Out-Null
          Copy-Item docs/USER_GUIDE_JA.md $d/docs/ -ErrorAction SilentlyContinue
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE $d/
          Copy-Item "はじめに.txt" $d/ -ErrorAction SilentlyContinue
          Copy-Item licenses $d/licenses -Recurse -ErrorAction SilentlyContinue
          Compress-Archive -Path $d -DestinationPath NODES-windows.zip
      - name: Upload Windows zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NODES-windows
          path: NODES-windows.zip
          retention-days: 30

  linux-startup:
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: NODES-linux-x64-${{ github.sha }}
          path: ${{ runner.temp }}/nodes-artifact
      - name: Install virtual X11 and Mesa runtime
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb xauth libgl1 libglx-mesa0 libgl1-mesa-dri mesa-utils libxkbcommon0 libxcb-render0 libxcb-shape0 libxcb-xfixes0 libxi6 libxrandr2 libxinerama1 libxcursor1
      - name: Verify real GUI frame using software OpenGL
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: |
          mkdir "$RUNNER_TEMP/nodes-unpacked"
          tar -xzf "$RUNNER_TEMP/nodes-artifact/NODES-linux-x64.tar.gz" -C "$RUNNER_TEMP/nodes-unpacked"
          xvfb-run -a -s "-screen 0 1920x1080x24 +extension GLX" glxinfo -B
          xvfb-run -a -s "-screen 0 1920x1080x24 +extension GLX" python3 scripts/native_smoke.py --cli "$RUNNER_TEMP/nodes-unpacked/nodes-cli" --gui "$RUNNER_TEMP/nodes-unpacked/NODES" --fixture examples/01.morph --output-dir "$RUNNER_TEMP/native-gui-linux"
      - name: Upload startup and frame evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-gui-linux-${{ github.sha }}
          path: ${{ runner.temp }}/native-gui-linux
          if-no-files-found: warn
          retention-days: 14

  windows-startup:
    if: github.event_name == 'workflow_dispatch'
    needs: windows
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: NODES-windows-x64-${{ github.sha }}
          path: ${{ runner.temp }}/nodes-artifact
      - name: Attempt real Windows GUI frame (hosted desktop availability may vary)
        shell: pwsh
        run: python scripts/native_smoke.py --cli "$env:RUNNER_TEMP/nodes-artifact/nodes-cli.exe" --gui "$env:RUNNER_TEMP/nodes-artifact/NODES.exe" --fixture examples/01.morph --output-dir "$env:RUNNER_TEMP/native-gui-windows"
      - name: Upload Windows startup evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-gui-windows-${{ github.sha }}
          path: ${{ runner.temp }}/native-gui-windows
          if-no-files-found: warn
          retention-days: 14
