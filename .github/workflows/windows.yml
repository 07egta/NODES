name: Check

on:
  pull_request:
  push:
    branches: [main, "evolve/**"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --all-targets --locked
      - name: Build Morphlet
        run: cargo build --release --locked --bin Morphlet
      - name: Package Windows zip
        shell: pwsh
        run: |
          $d = "Morphlet-windows"
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item target/release/Morphlet.exe $d/
          Copy-Item examples $d/examples -Recurse
          New-Item -ItemType Directory -Force $d/docs | Out-Null
          Copy-Item docs/USER_GUIDE_JA.md $d/docs/ -ErrorAction SilentlyContinue
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE $d/
          Copy-Item "はじめに.txt" $d/ -ErrorAction SilentlyContinue
          Copy-Item licenses $d/licenses -Recurse -ErrorAction SilentlyContinue
          Compress-Archive -Path $d -DestinationPath Morphlet-windows.zip
      - name: Upload Windows zip
        uses: actions/upload-artifact@v4
        with:
          name: Morphlet-windows
          path: Morphlet-windows.zip
          retention-days: 30
