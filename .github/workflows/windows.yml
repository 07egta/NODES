name: Check

on:
  pull_request:
  push:
    branches: [main, "evolve/**"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --all-targets --locked
      - name: Build Morphlet
        run: cargo build --release --locked --bin Morphlet
