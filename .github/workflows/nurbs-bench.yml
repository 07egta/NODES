name: NURBS benchmark

# Timings of the exact NURBS / B-rep operations on a GitHub-hosted runner (see
# docs/NURBS_PERFORMANCE.md). Runs by hand or on pushes to bench/** branches only.
on:
  workflow_dispatch:
  push:
    branches: ["bench/**"]

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: 1.100.0
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_JOBS: 2
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install desktop build libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev \
            libx11-dev libxi-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libgl1-mesa-dev
      - name: Machine
        run: |
          nproc
          grep -m1 'model name' /proc/cpuinfo
          free -m | head -2
          rustc --version
      - name: Benchmark
        run: cargo run --example nurbs_benchmark 2>&1 | tail -40
