[package]
name = "nodes"
default-run = "NODES"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "An independent Japanese-first desktop node geometry studio"

[dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "x11"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
# Already present in Cargo.lock via desktop dependencies; no proprietary GH SDK.
xml-rs = "=1.0.0"
image = { version = "0.25", default-features = false, features = ["png"] }
# Sandboxed user scripts (スクリプトノード). Exact pin; see docs/ARCHITECTURE.md section 10.
# No "sync" (the engine lives on one helper thread) and no "unchecked" (limits must stay on).
rhai = { version = "=1.27.0", default-features = false, features = ["std", "no_module", "no_time", "no_custom_syntax"] }
# Exact NURBS / B-rep / T-spline kernel vendored from SolidCraft (MIT OR Apache-2.0).
# See docs/SOLIDCRAFT_CHANGES.md and src/kernel_bridge.rs.
solidcraft-geom = { path = "crates/sc-geom" }
solidcraft-kernel = { path = "crates/sc-kernel" }
solidcraft-sketch = { path = "crates/sc-sketch" }

[workspace]
resolver = "3"
members = [".", "crates/sc-geom", "crates/sc-kernel", "crates/sc-sketch"]
# Third-party truck crates kept with SolidCraft's local fixes (vendor/README.md); not linted as ours.
exclude = ["vendor"]

# SolidCraft's fixed truck copies (Apache-2.0), wired in exactly as upstream SolidCraft does.
[patch.crates-io]
truck-geometry = { path = "vendor/truck-geometry" }
truck-shapeops = { path = "vendor/truck-shapeops" }
truck-stepio = { path = "vendor/truck-stepio" }
truck-meshalgo = { path = "vendor/truck-meshalgo" }
matext4cgmath = { path = "vendor/matext4cgmath" }

[profile.release]
opt-level = 3
lto = "fat"
strip = true
codegen-units = 1

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
# truck's debug-only checks reject valid geometry (seam edges, closed edges); SolidCraft builds
# its tests without them for the same reason.
debug-assertions = false

[profile.dev.package.solidcraft-geom]
opt-level = 2
debug-assertions = false

[profile.dev.package.solidcraft-sketch]
opt-level = 2
debug-assertions = false

[profile.dev.package.solidcraft-kernel]
opt-level = 2
debug-assertions = false

# Opt-in local iteration profiles. Keep dev/test/release defaults and kernel
# debug-assertion compatibility unchanged; never ship release-fast implicitly.
[profile.dev-fast]
inherits = "dev"
debug = 0
incremental = true

[profile.dev-fast.package."*"]
opt-level = 1
debug-assertions = false

# Keep geometry hot paths optimized, with the same assertion policy as dev.
[profile.dev-fast.package.solidcraft-geom]
opt-level = 2
debug-assertions = false

[profile.dev-fast.package.solidcraft-sketch]
opt-level = 2
debug-assertions = false

[profile.dev-fast.package.solidcraft-kernel]
opt-level = 2
debug-assertions = false

[profile.release-fast]
inherits = "release"
lto = "thin"
codegen-units = 16

[[bin]]
name = "NODES"
path = "src/main.rs"

